  /* الألوان الأساسية */
  :root{
    --bg:#F6F3FB;
    --ink:#2B2536;
    --muted:#716888;
    --accent:#7A5BAE;
    --accent-ink:#FFFFFF;
    --line:#E3DAF0;
    --n1:#FFFFFF;
    --n2:#EEE6FA;
    --n3:#F8ECF5;
    --n4:#E8E8F8;
    --n5:#F2EBFB;
    --err:#B3412F;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Tufuli","Baloo Bhaijaan 2", Tahoma, sans-serif;
    font-size:18px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 16px 64px}

  header h1{
    font-size:clamp(34px,8vw,52px);
    font-weight:700;
    line-height:1.15;
    margin:0 0 6px;
    color:var(--accent);
  }
  header{margin-bottom:22px}

  /* صندوق الكتابة */
  .composer{
    background:var(--n1);
    border:2px solid var(--line);
    border-radius:22px;
    padding:14px 14px 12px;
    transition:border-color .15s;
  }
  .composer:focus-within{border-color:var(--accent)}
  textarea{
    width:100%;
    min-height:96px;
    resize:vertical;
    border:0;
    outline:0;
    background:transparent;
    font:inherit;
    color:var(--ink);
  }
  textarea::placeholder{color:#A79CBC}
  .bar{display:flex;align-items:center;gap:12px;margin-top:6px}
  .count{color:var(--muted);font-size:15px;margin-inline-end:auto}
  .count.over{color:var(--err)}
  button{
    font:inherit;
    font-weight:600;
    background:var(--accent);
    color:var(--accent-ink);
    border:0;
    border-radius:999px;
    padding:8px 26px;
    cursor:pointer;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:3px solid #CDB9EC;outline-offset:2px}
  textarea:focus-visible{outline:0}
  .status{min-height:26px;margin:8px 4px 0;font-size:15px;color:var(--muted)}
  .status.err{color:var(--err)}

  /* الرسائل */
  .feed{
    margin-top:28px;
    columns:2 260px;
    column-gap:14px;
  }
  .note{
    break-inside:avoid;
    margin:0 0 14px;
    border-radius:18px;
    padding:14px 16px 10px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }
  .note:nth-child(5n+1){background:var(--n2)}
  .note:nth-child(5n+2){background:var(--n3)}
  .note:nth-child(5n+3){background:var(--n4)}
  .note:nth-child(5n+4){background:var(--n5)}
  .note:nth-child(5n+5){background:var(--n1)}
  .note time{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
  .note.fresh{animation:pop .4s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){.note.fresh{animation:none}}

  .empty{
    margin-top:28px;
    text-align:center;
    color:var(--muted);
    padding:40px 16px;
    border:2px dashed var(--line);
    border-radius:22px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>نوايانا</h1>
  </header>

  <form class="composer" id="form">
    <textarea id="msg" maxlength="500" placeholder="اكتبي نيتك هون..." aria-label="النية"></textarea>
    <div class="bar">
      <span class="count" id="count">0 / 500</span>
      <button type="submit" id="send" disabled>إرسال</button>
    </div>
  </form>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="feed" id="feed"></div>
  <div class="empty" id="empty" hidden>لسا ما في نوايا.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// إعدادات الاتصال بقاعدة البيانات (المفتاح عام وآمن للاستخدام بالمتصفح)
const SUPABASE_URL = "https://kltwxjplwpuefhjnemnq.supabase.co";
const SUPABASE_KEY = "sb_publishable_c2srueTIBH9emOH5nODFAQ_4zCFGSWX";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MAX_LEN = 500;          // أقصى طول للرسالة
const POLL_MS = 5000;         // التحديث كل 5 ثواني
const PER_MINUTE = 3;         // أقصى عدد رسائل من نفس الجهاز بالدقيقة

const form = document.getElementById("form");
const msg = document.getElementById("msg");
const send = document.getElementById("send");
const count = document.getElementById("count");
const statusEl = document.getElementById("status");
const feed = document.getElementById("feed");
const empty = document.getElementById("empty");

let lastId = 0;
const shown = new Set();

// كتابة الوقت بشكل "قبل كذا"
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "هلأ";
  const m = Math.floor(s / 60);
  if (m < 60) return m === 1 ? "قبل دقيقة" : m === 2 ? "قبل دقيقتين" : `قبل ${m} دقايق`;
  const h = Math.floor(m / 60);
  if (h < 24) return h === 1 ? "قبل ساعة" : h === 2 ? "قبل ساعتين" : `قبل ${h} ساعات`;
  const d = Math.floor(h / 24);
  return d === 1 ? "مبارح" : d === 2 ? "قبل يومين" : `قبل ${d} أيام`;
}

// إنشاء كرت الرسالة (textContent عشان ما حدا يحط كود)
function makeNote(row, fresh){
  const el = document.createElement("article");
  el.className = "note" + (fresh ? " fresh" : "");
  el.textContent = row.body;
  const t = document.createElement("time");
  t.dateTime = row.created_at;
  t.textContent = ago(row.created_at);
  el.appendChild(t);
  return el;
}

function render(rows, fresh){
  // الأحدث فوق
  for (const row of rows){
    if (shown.has(row.id)) continue;
    shown.add(row.id);
    feed.prepend(makeNote(row, fresh));
    if (row.id > lastId) lastId = row.id;
  }
  empty.hidden = shown.size > 0;
}

// تحميل أول مرة: آخر 200 رسالة
async function loadInitial(){
  const { data, error } = await db.from("wall_messages")
    .select("id, body, created_at")
    .order("id", { ascending: false })
    .limit(200);
  if (error){ setStatus("ما قدرنا نجيب النوايا. اعملي تحديث للصفحة.", true); return; }
  render(data.reverse(), false);
}

// جلب الرسائل الجديدة بس
async function poll(){
  const { data, error } = await db.from("wall_messages")
    .select("id, body, created_at")
    .gt("id", lastId)
    .order("id", { ascending: true });
  if (!error && data.length) render(data, true);
  // تحديث أوقات الرسائل
  feed.querySelectorAll("time").forEach(t => t.textContent = ago(t.dateTime));
}

function setStatus(text, isErr){
  statusEl.textContent = text;
  statusEl.classList.toggle("err", !!isErr);
}

// حد الإرسال من نفس الجهاز
function recentSends(){
  try{
    const arr = JSON.parse(localStorage.getItem("wall_sends") || "[]");
    return arr.filter(t => Date.now() - t < 60000);
  }catch{ return []; }
}
function rememberSend(){
  try{
    const arr = recentSends(); arr.push(Date.now());
    localStorage.setItem("wall_sends", JSON.stringify(arr));
  }catch{}
}

msg.addEventListener("input", () => {
  const n = msg.value.trim().length;
  count.textContent = `${msg.value.length} / ${MAX_LEN}`;
  count.classList.toggle("over", msg.value.length >= MAX_LEN);
  send.disabled = n === 0;
});

// إرسال بـ Ctrl+Enter
msg.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit();
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const body = msg.value.trim();
  if (!body) return;
  if (recentSends().length >= PER_MINUTE){
    setStatus("بعتّي كثير بدقيقة وحدة، استني شوي وجربي كمان مرة.", true);
    return;
  }
  send.disabled = true;
  setStatus("عم بنبعت...");
  const { error } = await db.from("wall_messages").insert({ body });
  if (error){
    const busy = (error.message || "").includes("too_many_messages");
    setStatus(busy ? "في ضغط هلأ، جربي بعد دقيقة." : "ما انبعتت، تأكدي من النت وجربي كمان مرة.", true);
    send.disabled = false;
    return;
  }
  rememberSend();
  msg.value = "";
  count.textContent = `0 / ${MAX_LEN}`;
  setStatus("انبعتت ✓");
  setTimeout(() => setStatus(""), 2500);
  poll();
});

loadInitial().then(() => setInterval(poll, POLL_MS));
</script>
